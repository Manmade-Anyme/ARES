name: Fly App Schedule

on:
  schedule:
    - cron: '45 3 * * 1-5' # 9:15 AM IST
    - cron: '0 10 * * 1-5' # 3:30 PM IST

jobs:
  scale-app:
    runs-on: ubuntu-latest
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      
      - name: Start App (9:15 AM IST)
        if: github.event.schedule == '45 3 * * 1-5'
        run: flyctl scale count 1 -a ares-xzy-gq
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          
      - name: Stop App (3:30 PM IST)
        if: github.event.schedule == '0 10 * * 1-5'
        run: flyctl scale count 0 -a ares-xzy-gq
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

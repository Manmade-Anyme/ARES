name: Offline ML Model Training

"on":
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 6" # Weekly on Saturday at 00:00 UTC (05:30 IST)

concurrency:
  group: ml-training
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ml_signal/requirements.txt

      - name: Run offline ML model training
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          METRICS_PATH: reports/ml/task183_offline_metrics.json
        run: |
          rm -f "$METRICS_PATH"
          python -m ml_signal.train_offline
          test -f "$METRICS_PATH"

      - name: Publish metrics to Job Summary
        if: always()
        run: |
          if [ -f "reports/ml/task183_offline_metrics.json" ]; then
            echo "### 🤖 ML Offline Model Training Summary" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat reports/ml/task183_offline_metrics.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "[-] No training metrics report was produced." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Post weekly ML report to Discord
        if: success()
        continue-on-error: true
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          METRICS_PATH: reports/ml/task183_offline_metrics.json
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::warning::DISCORD_WEBHOOK_URL not set — skipping weekly ML report"
            exit 0
          fi
          if [ ! -f "$METRICS_PATH" ]; then
            echo "::warning::Training metrics missing — skipping weekly ML report"
            exit 0
          fi

          VERSION="$(jq -r '.model_version // "unknown"' "$METRICS_PATH")"
          SHAP_PLOT="reports/ml/${VERSION}_shap_summary.png"
          SHARPE="$(jq -r 'if .sharpe_status == "computed" then (.sharpe_annualized | tostring) else "n/a" end' "$METRICS_PATH")"
          SHARPE_DETAIL="$(jq -r 'if .sharpe_status == "computed" then "\(.sharpe_days) days, \(.sharpe_trades) trades, \(.sharpe_window_start) to \(.sharpe_window_end)" else .sharpe_status end' "$METRICS_PATH")"
          CONTENT="📊 **ARES weekly ML report — ${VERSION}**
          Sharpe (annualized): **${SHARPE}**
          Basis: active-trading-day NIFTY spot P&L points, zero risk-free rate
          Window: ${SHARPE_DETAIL}
          AUC: $(jq -r '.auc_roc // "n/a"' "$METRICS_PATH") | SHAP: $(jq -r '.shap_status // "n/a"' "$METRICS_PATH")"

          if [ -f "$SHAP_PLOT" ]; then
            PAYLOAD="$(jq -n --arg content "$CONTENT" --arg image "attachment://$(basename "$SHAP_PLOT")" '{content: $content, embeds: [{image: {url: $image}}]}')"
            curl -sS --fail-with-body -X POST \
              -F "payload_json=$PAYLOAD" \
              -F "files[0]=@${SHAP_PLOT};type=image/png" \
              "$WEBHOOK"
          else
            jq -n --arg content "$CONTENT" '{content: $content}' \
              | curl -sS --fail-with-body -X POST -H 'Content-Type: application/json' -d @- "$WEBHOOK"
          fi

      - name: Commit and push updated model artifact to main
        if: github.ref == 'refs/heads/main' || github.event_name == 'schedule'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f ml_signal/models/ reports/ml/
          if git diff --staged --quiet; then
            echo "[*] Model artifacts are unchanged."
          else
            git commit -m "chore(ml): update trained model artifact and metrics report [skip ci]"
            git push origin main
          fi

      - name: Upload trained model and report artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ml-trained-model-and-report
          path: |
            ml_signal/models/
            reports/ml/
          retention-days: 30

  deploy:
    needs: train
    if: github.ref == 'refs/heads/main' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --local-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

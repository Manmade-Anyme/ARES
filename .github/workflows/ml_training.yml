name: Offline ML Model Training

"on":
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 6" # Weekly on Saturday at 00:00 UTC (05:30 IST)

jobs:
  train:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ml_signal/requirements.txt

      - name: Run offline ML model training
        run: |
          python -m ml_signal.train_offline

      - name: Publish metrics to Job Summary
        if: always()
        run: |
          if [ -f "reports/ml/task183_offline_metrics.json" ]; then
            echo "### 🤖 ML Offline Model Training Summary" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat reports/ml/task183_offline_metrics.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "[-] No training metrics report was produced." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload trained model and report artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ml-trained-model-and-report
          path: |
            ml_signal/models/
            reports/ml/
          retention-days: 30

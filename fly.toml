# fly.toml app configuration file generated for ares-xzy-gq on 2026-07-15T07:15:38Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ares-xzy-gq'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[env]
  TZ = 'Asia/Kolkata'

[processes]
  app = 'sh scripts/run_app_with_jev.sh'

[[vm]]
  memory = '1024mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
  processes = ['app']
  size = 'shared-cpu-1x'

[[restart]]
  policy = 'never'
  processes = ['app']
